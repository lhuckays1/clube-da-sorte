# ----------------------------------------------------------------------
# DEFINITIVE NGINX CONFIGURATION FOR PRODUCTION HIGH-TRAFFIC DEPLOYMENT
# Target Domains:
#   - clubedasorte.athominfotech.com.br (Client Web Application portal)
#   - api.clubedasorte.athominfotech.com.br (Administrative & APIs engine)
# ----------------------------------------------------------------------

# 1. FRONTEND APP & GENERAL WEBSITE PORTS
server {
    listen 80;
    server_name clubedasorte.athominfotech.com.br www.clubedasorte.athominfotech.com.br;

    # Gzip Compression filters for lightweight payload speed
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # Connection Upgrade for standard keepalive and WebSocket handshakes
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # IP Tracking transparency
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom specifications for high-load real-time Socket.IO WebSockets connections
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Extend read/write timeouts to keep connections alive up to 24h
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Basic Client constraints and security hardening headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    client_max_body_size 12M;
}

# 2. SEPARATED API DOMAIN SPECIFICATIONS FOR WEB PORTALS
server {
    listen 80;
    server_name api.clubedasorte.athominfotech.com.br;

    # Gzip Compression filters
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Core IP Tracking headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep Socket.IO connections path available on API domain if required by integrations
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Policy and security standards filters
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    client_max_body_size 12M;
}
